[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-archiver"
version = "0.4.0"
description = "Index, search and analyze your Claude Code sessions and every version of every plan"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Igor Kryltsov"}
]
maintainers = [
    {name = "Igor Kryltsov"}
]
keywords = ["claude", "claude-code", "session", "plans", "search", "index", "sqlite", "fts5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
synthesis = ["anthropic>=0.30.0"]

# Archiver names (upstream: sessions, session-index, session-search,
# session-analyze, session-topic-capture). Topic capture isn't exposed while
# running in parallel with upstream; it comes back at cut-over.
[project.scripts]
archiver = "session_index.cli:main"
archiver-index = "session_index.indexer:main"
archiver-search = "session_index.search:main"
archiver-analyze = "session_index.analyzer:main"
archiver-plan-capture = "session_index.hooks:plan_capture_main"

[project.urls]
Homepage = "https://github.com/kryltsov/claude-archiver"
Repository = "https://github.com/kryltsov/claude-archiver"
Issues = "https://github.com/kryltsov/claude-archiver/issues"
"Upstream project" = "https://github.com/lee-fuhr/claude-session-index"

[tool.setuptools.packages.find]
include = ["session_index*"]
